[package]
name = "comission-manager"
version = "0.1.0"
description = "Gestion des Commissions AGA & Courtiers"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "comission_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
lopdf = "0.35"
calamine = "0.26"
rust_xlsxwriter = "0.78"
base64 = "0.23.1"
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
